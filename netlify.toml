[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/.well-known/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/ai-catalog.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/ard.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200